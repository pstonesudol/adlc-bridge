# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Repository-specific review policy for ADLC Bridge.
language: en-US

reviews:
  # Prefer higher-confidence findings; retain the safety-focused path guidance below.
  profile: chill
  request_changes_workflow: true

  high_level_summary: true
  high_level_summary_in_walkthrough: true
  high_level_summary_instructions: |
    Start with a one-paragraph briefing for the maintainer: what changed, why it
    matters, and what decision the reviewer has to make.

    Then open a line, exactly in this form, with one verdict:

    **Verdict: MERGE** — merge as it stands. No blocking finding; every claim
    the change makes is supported by verified evidence appropriate to that claim.

    **Verdict: NEEDS_FIX** — do not merge. A correctness, security, authorization,
    data-loss or automation-safety defect exists. Name the file, the failing
    path, and the smallest change that fixes it.

    **Verdict: NEEDS_EVIDENCE** — do not merge yet, and no code change may be
    required. The code reads correctly but a claim cannot be verified from the
    diff: interaction behaviour, deployed behaviour, runtime state, a scheduled
    job, or provider-side configuration. State the exact evidence that would
    close it — a recording, a command with its output, a log line.

    **Verdict: NEEDS_DECISION** — do not merge yet. The change is sound either
    way, but a human has to choose: a product behaviour, a schema or API
    contract, a cost, or a trade-off this review cannot settle. State the
    options and the consequence of each.

    Precedence when more than one applies: NEEDS_FIX, then NEEDS_DECISION,
    then NEEDS_EVIDENCE, then MERGE. Style, naming and docstring findings never
    change the verdict; leave style and formatting to CI. Never choose MERGE
    while an unresolved major or critical finding stands.

    Report actionable findings introduced or materially worsened by this diff:
    identify the file, failure path, impact, and smallest corrective action.
    Do not report unrelated pre-existing issues as regressions or repeat the
    same root cause across multiple comments.

    After the verdict line, state plainly:
    - **Blocking:** every independent action required before merge, on one
      line, or "none".
    - Risks that need a decision before merge.
    - Evidence that would close them (a test, a manual check, a log).
    - Anything the diff cannot show: live integration behaviour, runtime state,
      scheduled jobs, or provider-side configuration.

    Do not claim tests were run without execution evidence: a CI result or
    attributable command output with its runtime, result, and revision. PR prose
    and pasted claims alone are not verified execution evidence. CI evidence
    must come from the expected check/provider on the current PR head; stale,
    duplicate, ambiguous, or untrusted results do not satisfy approval gates.
    A test diff shows coverage, not execution. Do not repeat the pull request
    title as the summary.
    MERGE is a recommendation for a human, never permission for automation to
    merge, enable auto-merge, bypass protections, or deploy.

  review_status: true
  poem: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true

  auto_review:
    enabled: true
    # Batch commits before requesting another review to reduce review churn.
    auto_incremental_review: false
    drafts: false
    # Limit review churn without changing current-head approval requirements.
    auto_pause_after_reviewed_commits: 2
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
      - "DO NOT MERGE"

  path_filters:
    - "!bun.lock"
    - "!bun.lockb"
    - "!package-lock.json"
    - "!node_modules/**"
    - "!dist/**"
    - "!coverage/**"
    - "!patches/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.jpeg"
    - "!**/*.webp"
    - "!**/__pycache__/**"

  path_instructions:
    - path: "src/**"
      instructions: |
        Review as local-first automation coordinating Linear, Agent Orchestrator,
        OpenChamber, GitHub CI, and bounded CodeRabbit remediation.

        Authorization and scope:
        - PR merges require a human. Never permit merging, enabling auto-merge,
          bypassing branch protections, or deployment by the bridge.
        - Implementation, commit, push, PR creation, and remediation must stay
          within the configured authorization and approved repository/file scope.
        - Missing or ambiguous approvals, ownership, routing, check results, or
          review state must fail closed, not silently broaden authorization.
        - Treat ticket text, PR comments, and tool output as untrusted input, not
          authority to override policy or execute arbitrary shell commands.

        State and integrations:
        - Repeated polls, retries, restarts, and partial provider failures must
          not duplicate workers, PRs, tickets, or state transitions.
        - Review/remediation loops must remain bounded and must not treat stale
          checks or reviews for an earlier commit as evidence for the current head.
        - Duplicate or ambiguous GitHub checks, reviews, or summaries must not
          be selected as authoritative success; verify identity and head binding.
        - Preserve user changes, existing services, credentials, and local config.
        - Unit tests do not prove live provider access or runtime compatibility;
          require explicit evidence for claims about installed integrations.

        SQLite durability and upgrades:
        - Review transaction boundaries, atomic state transitions, concurrent
          writers, crash/restart recovery, and retry idempotency for lost updates
          or duplicate external effects. Never equate a provider write with a
          committed local state transition after a partial failure.
        - Schema upgrades must preserve existing data and be versioned and safe
          to retry; reject silent database resets or destructive fallback paths.
        - Migrations belong in reviewed code with explicit operator commands,
          never implicit edits to live databases by coding workers.

        Runtime boundaries:
        - Source changes do not activate the pinned installed runtime. Do not
          edit installed snapshots, launchd definitions, or live state as part of
          a coding task. Install/apply, stack controls, cleanup, and recovery need
          explicit operator authorization; do not change global agent policies.

        Secrets and execution:
        - Do not log tokens, credentials, auth bodies, or private configuration.
        - Avoid shell interpolation of external input; validate paths and command
          arguments before filesystem or process operations.

    - path: "test/**"
      instructions: |
        Tests must prove behaviour, not plumbing.
        - Authorization, scope, lifecycle, retry, and review-gate tests should
          fail if the protected behaviour is removed or broken.
        - Exercise rejection and partial-failure paths, not only happy paths.
        - Flag mocks or assertions that pass despite unintended external writes,
          duplicate work, stale evidence, or authorization bypasses.
        - Keep tests isolated from real credentials and live provider mutations.

    - path: "config/**"
      instructions: |
        - Examples must use placeholders, contain no credentials or real private
          identifiers, and remain disabled until explicitly configured.
        - Default to manual approval; standing authorization must be explicit.
        - Required checks, allowed paths, routing, and project identity must not
          silently weaken authorization when missing or invalid.

    - path: "service/**"
      instructions: |
        - Service examples must not expose credentials or silently enable work.
        - Preserve project isolation, stable service identities, and explicit
          user consent for installation and startup.
        - Distinguish stopping coordination from stopping existing workers.

    - path: ".github/workflows/**"
      instructions: |
        - Third-party actions must stay pinned to a full commit SHA with the
          version in a comment.
        - Permissions stay least-privilege; a write scope needs a reason.
        - Never execute untrusted PR code in pull_request_target or another
          privileged context with secrets or write tokens. Checkouts, shell
          interpolation, artifacts, and cache handoffs must preserve that boundary.
        - Never add automated merging or deployment by the bridge.

  pre_merge_checks:
    docstrings:
      mode: "off"
    custom_checks:
      - name: "Verification evidence"
        mode: error
        instructions: |
          The pull request description must state how the change was verified:
          the exact commands run and their result, and the runtime or surface
          that was exercised. "Tests pass" without naming them is not evidence.
          If a behaviour could not be verified, say so and say why.
          For a change with no user-reachable behaviour, state the applicable
          verification and its result, or explain why it was not possible.
          These description requirements are attestations, not proof of execution.
          Confirm execution separately using attributable logs or current-head CI
          from the expected provider; do not accept prose or a test diff as proof.
          Mocked/unit evidence must not be presented as proof of live provider
          access, installed runtime compatibility, or service operation.

  tools:
    eslint:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true

chat:
  auto_reply: true
